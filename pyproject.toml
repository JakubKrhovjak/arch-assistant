[project]
name = "arch-assistant"
version = "0.1.0"
description = "Tray assistant for Arch Linux + Plasma: updates, packages, system health, cleanup"
requires-python = ">=3.13"
dependencies = ["jeepney>=0.8"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arch_assistant", "arch_assistant.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
